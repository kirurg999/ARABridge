name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ARA Bridge version
      description: Shown at the bottom of the plugin window
      placeholder: 1.0.20-beta
    validations:
      required: true
  - type: dropdown
    id: daw
    attributes:
      label: DAW
      options:
        - Fender Studio Pro
        - Steinberg Cubase Pro
        - Other
    validations:
      required: true
  - type: input
    id: daw_version
    attributes:
      label: DAW version
      placeholder: "8.0.1"
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and version
      placeholder: iZotope RX 12 Connect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select an audio event
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: Tick "Enable logging" in the plugin, reproduce the problem, then drag the newest file from %APPDATA%\ARABridge\logs\ here
